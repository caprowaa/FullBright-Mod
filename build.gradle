plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
}

version = "1.1.0"
group = "com.example"

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" } // Репозиторий для Cloth Config
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.14.22"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.83.0+1.20.1"

    // Библиотеки для меню настроек
    modApi "me.shedaniel.cloth:cloth-config-fabric:11.1.118"
    include "me.shedaniel.cloth:cloth-config-fabric:11.1.118"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
